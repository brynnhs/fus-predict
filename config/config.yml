# fus-predict configuration
# --------------------------
# All pipeline parameters live here. Scripts read this via
# project.load_project_config() and never hardcode values.

# ---------------------------------------------------------------------------
# Paths (relative to repo root)
# ---------------------------------------------------------------------------
paths:
  sourcedata:    data/sourcedata
  preprocessing: derivatives/preprocessing
  modeling:      derivatives/modeling

# ---------------------------------------------------------------------------
# Subjects
# ---------------------------------------------------------------------------
subjects:
  all:
    - secundo
  sessions_to_exclude:
    secundo: [Se05022020, Se22102019, Se25082020, Se27072020, Se31012020]

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:

  period: both       # baseline | task | both

  baseline:
    apply_log10: true
    log10_eps:   1.0e-6
    overwrite:   false

  geometry:
    rotate_k:    -1
    target_size: 112
    save_previews: true
    overwrite:   true
    flip_session_ids_by_subject:
      gus: [Gu05082020, Gu30032021, Gu30042021]
      secundo: [Se04092020, Se01092020, Se25082020, Se03092020, Se27082020, Se04082020, Se24022020]

  filtering:
    enable_lowpass:     false
    lowpass_cutoff_hz:  0.5
    lowpass_order:      4
    enable_highpass:    false
    highpass_cutoff_hz: 0.01
    highpass_order:     3
    enable_clip:        false
    clip_bottom:        1.0
    clip_top:           99.0
    fps_fallback:       2.5
    overwrite:          true

  standardization:
    eps:               1.0e-8
    floor_percentile:  10.0
    clip_abs:          6.0
    smooth_kernel_sizes: [3, 5, 7]
    causal:            true
    overwrite:         true

  tissue_segmentation:
    method:                      roi   # imclose | cv_threshold | roi
    vessel_intensity_percentile: 70.0
    closing_radius:              2
    min_component_pixels:        1000
    # cv_threshold params (used when method: cv_threshold)
    cv_percentile:               5.0      # min CV percentile to be considered vessel
    # roi params (used when method: roi)
    roi_intensity_percentile:    85.0     # low threshold to capture all brain tissue
    roi_closing_radius:          25       # large closing to bridge gaps and smooth boundary
    overwrite:                   true

# ---------------------------------------------------------------------------
# Signal characterization
# ---------------------------------------------------------------------------
persistence_analysis:
  min_var:               1.0e-6
  fps_fallback:          2.5
  max_acf_lag:          100
  example_target_frame:  10
  pearson_rolling_window: 20
  acf_patch_sizes: [1, 5, 10, 14, 20, 28]
  summary_lags: [5, 10, 20]

# ---------------------------------------------------------------------------
# AR / modeling
# ---------------------------------------------------------------------------
ar_analysis:
  patch_lag_pca_ar_patch_size: 14
  primary_session_id:          Se01092020
  # Must match subjects.sessions_to_exclude.secundo
  within_session_exclude: [Se05022020, Se22102019, Se25082020, Se27072020, Se31012020]

modeling:
  frame_rate:    2.5
  train_frac:    0.8
  n_lags:        10
  horizons:      [1]

  pixel_ar:
    ridge_lambda: 0.01

  patch_lag_pca_ar:
    patch_size:   14
    n_components: 6
    ridge_lambda: 0.01

  patch_lag_ica_ar:
    patch_size:   14
    n_components: 6
    ridge_lambda: 0.01
    ica_algorithm:
      algorithm: parallel
      fun: logcosh

  frozen_basis_ar:
    method:       pca   # pca | ica — basis frozen on the full baseline period
    n_components: 6
    ridge_lambda: 0.01
    ica_algorithm:
      algorithm: parallel
      fun: logcosh

  convlstm:
    hidden_channels:  32
    kernel_size:      3
    n_layers:         1
    forget_gate_bias: 1.0
    learning_rate:    3.0e-4
    batch_size:       128
    n_epochs:         50
    grad_clip_norm:   1.0

  convlstm_pca_latent:
    hidden_channels:  32
    n_components:     6
    learning_rate:    3.0e-4
    batch_size:       128
    n_epochs:         50
    grad_clip_norm:   1.0

  convlstm_ica_latent:
    hidden_channels:  32
    n_components:     6
    learning_rate:    3.0e-4
    batch_size:       128
    n_epochs:         50
    grad_clip_norm:   1.0
    ica_algorithm:
      algorithm: parallel
      fun: logcosh

  patch_pca_convlstm:
    patch_size:       14
    n_components:     6
    hidden_channels:  32
    kernel_size:      3
    learning_rate:    3.0e-4
    batch_size:       128
    n_epochs:         50
    grad_clip_norm:   1.0

  pca_basis:
    max_frames: 2000
    seed:       42
    use_torch:  true
    device:     cuda