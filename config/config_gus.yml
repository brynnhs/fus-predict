# fus-predict configuration — gus experiment
# ---------------------------------------------
# Switch to this config with: python scripts/preprocess.py --config config_gus.yml
#                             python scripts/benchmarking/run_benchmark.py --config config_gus.yml
#                             python scripts/decomposition/decompose.py --config config/decompose.yml --project-config config_gus.yml

# ---------------------------------------------------------------------------
# Paths (relative to repo root)
# ---------------------------------------------------------------------------
paths:
  sourcedata:    data/sourcedata
  preprocessing: derivatives/preprocessing
  modeling:      derivatives/modeling/gus

# ---------------------------------------------------------------------------
# Subjects
# ---------------------------------------------------------------------------
subjects:
  all:
    - gus
  sessions_to_exclude:
    gus: []
  species: monkey

  excel_metadata: null

# ---------------------------------------------------------------------------
# Preprocessing
# ---------------------------------------------------------------------------
preprocessing:

  period: baseline   # baseline | task | both

  baseline:
    apply_log10: true
    log10_eps:   1.0e-6
    overwrite:   true

  geometry:
    rotate_k:    0
    target_size: 112
    save_previews: true
    overwrite:   true
    flip_session_ids_by_subject:
      gus: []

  filtering:
    enable_lowpass:     true
    lowpass_cutoff_hz:  0.5
    lowpass_order:      4
    enable_highpass:    false
    highpass_cutoff_hz: 0.01
    highpass_order:     3
    enable_clip:        false
    clip_bottom:        1.0
    clip_top:           99.0
    fps_fallback:       2.5
    overwrite:          true

  standardization:
    eps:               1.0e-8
    floor_percentile:  10.0
    clip_abs:          3.0
    smooth_kernel_sizes: []
    causal:            true
    overwrite:         true

  tissue_segmentation:
    vessel_intensity_percentile: 75.0
    closing_radius:              3
    min_component_pixels:        50
    overwrite:                   true

# ---------------------------------------------------------------------------
# Signal characterization
# ---------------------------------------------------------------------------
persistence_analysis:
  min_var:               1.0e-6
  fps_fallback:          2.5
  max_acf_lag:           20
  example_target_frame:  10
  pearson_rolling_window: 20
  acf_patch_sizes: [1, 5, 10, 14, 20, 28]

# ---------------------------------------------------------------------------
# AR / modeling
# ---------------------------------------------------------------------------
ar_analysis:
  patch_lag_pca_ar_patch_size: 14
  primary_session_id:          Gu03092020
  within_session_exclude: []

modeling:
  frame_rate:    2.5
  train_frac:    0.8
  n_lags:        10
  horizons:      [1]

  pixel_ar:
    ridge_lambda: 0.01

  patch_lag_pca_ar:
    patch_size:   14
    n_components: 10
    ridge_lambda: 0.01

  patch_lag_ica_ar:
    patch_size:   14
    n_components: 10
    ridge_lambda: 0.01
    ica_algorithm:
      algorithm: parallel
      fun: logcosh

  frozen_basis_ar:
    method:       pca
    n_components: 10
    ridge_lambda: 0.01
    ica_algorithm:
      algorithm: parallel
      fun: logcosh

  convlstm:
    hidden_channels:  32
    kernel_size:      3
    n_layers:         1
    forget_gate_bias: 1.0
    learning_rate:    3.0e-4
    batch_size:       128
    n_epochs:         50
    grad_clip_norm:   1.0

  convlstm_pca_latent:
    hidden_channels:  32
    n_components:     12
    learning_rate:    3.0e-4
    batch_size:       128
    n_epochs:         50
    grad_clip_norm:   1.0

  convlstm_ica_latent:
    hidden_channels:  32
    n_components:     12
    learning_rate:    3.0e-4
    batch_size:       128
    n_epochs:         50
    grad_clip_norm:   1.0
    ica_algorithm:
      algorithm: parallel
      fun: logcosh

  pca_basis:
    max_frames: 2000
    seed:       42
    use_torch:  true
    device:     cuda
